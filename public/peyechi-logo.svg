<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 180" width="100%" height="100%">
  <defs>
    <!-- Rich emerald gradient for the typography -->
    <linearGradient id="peyechiEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04563a" />
      <stop offset="60%" stop-color="#034830" />
      <stop offset="100%" stop-color="#023824" />
    </linearGradient>

    <!-- Pin gradients -->
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Subtle drop shadow -->
    <filter id="logoShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#022c1e" flood-opacity="0.12" />
    </filter>
  </defs>

  <g id="brand-logo" filter="url(#logoShadow)">
    <!-- Main Bengali Typography 'পেয়েছি' -->
    <text 
      x="250" 
      y="108" 
      text-anchor="middle" 
      font-family="'Hind Siliguri', 'Noto Sans Bengali', system-ui, -apple-system, sans-serif" 
      font-weight="800" 
      font-size="92" 
      fill="url(#peyechiEmerald)" 
      letter-spacing="-0.5"
    >
      পেয়েছি
    </text>

    <!-- Embedded Map Pin Marker in the 'প' letter loop -->
    <g transform="translate(133, 67) scale(0.75)">
      <!-- Outer pin halo / shadow -->
      <circle cx="16" cy="16" r="15" fill="#047857" opacity="0.15" />
      <!-- The Map Pin shape -->
      <path 
        d="M16 2 C10.48 2 6 6.48 6 12 C6 18.5 16 29 16 29 C16 29 26 18.5 26 12 C26 6.48 21.52 2 16 2 Z" 
        fill="url(#pinGrad)" 
        stroke="#ffffff" 
        stroke-width="1.5"
      />
      <!-- Inner circular core -->
      <circle cx="16" cy="11.5" r="4" fill="#ffffff" />
      <circle cx="16" cy="11.5" r="2" fill="#04563a" />
    </g>

    <!-- 3 Golden Yellow Sparkle Rays over top right -->
    <g id="sparkle-rays" stroke="#f59e0b" stroke-width="5" stroke-linecap="round">
      <!-- Left Ray -->
      <line x1="362" y1="46" x2="370" y2="30" />
      <!-- Center Ray -->
      <line x1="380" y1="52" x2="395" y2="40" />
      <!-- Right Ray -->
      <line x1="388" y1="66" x2="404" y2="60" />
    </g>
    <!-- Sparkle core star dot -->
    <circle cx="376" cy="50" r="3" fill="#fbbf24" />
  </g>

  <!-- Tagline underneath with dual dashes -->
  <g transform="translate(0, 150)">
    <!-- Left Dash -->
    <line x1="75" y1="0" x2="105" y2="0" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" />

    <!-- Tagline Text -->
    <text 
      x="260" 
      y="4.5" 
      text-anchor="middle" 
      font-family="'Hind Siliguri', 'Noto Sans Bengali', system-ui, -apple-system, sans-serif" 
      font-weight="600" 
      font-size="18" 
      fill="#04563a" 
      letter-spacing="0.3"
    >
      হারানো জিনিস ফিরে আসুক আপন ঠিকানায়।
    </text>

    <!-- Right Dash -->
    <line x1="415" y1="0" x2="445" y2="0" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" />
  </g>
</svg>
